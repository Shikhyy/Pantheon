[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/openzeppelin-contracts/lib/forge-std/src/",
]

[profile.default.fmt]
line_length = 120
tab_width = 4

[rpc_endpoints]
og_testnet = "${OG_RPC_URL}"
unichain_testnet = "https://sepolia.unichain.org"
local = "http://127.0.0.1:8545"

[etherscan]
og_testnet = { key = "${OG_PRIVATE_KEY}", url = "https://chainscan-newton.0g.ai/api" }